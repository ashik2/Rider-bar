name: Build Debug APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Clean gradle wrapper
        run: |
          rm -rf gradle/wrapper/gradle-wrapper.jar
          rm -rf .gradle/

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Regenerate gradle wrapper
        run: ./gradlew wrapper

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: debug-build-${{ github.run_number }}
          release_name: Debug Build #${{ github.run_number }}
          body: |
            Automatic debug build from commit ${{ github.sha }}
            
            Download the APK from the artifacts section.
          draft: false
          prerelease: true
