name: Build Debug APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download Gradle wrapper JAR
        run: |
          mkdir -p gradle/wrapper
          cd gradle/wrapper
          curl -L -o gradle-wrapper.jar https://github.com/gradle/gradle/releases/download/v9.3.1/gradle-9.3.1-bin.zip
          unzip -q gradle-9.3.1-bin.zip
          cd ../../
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: debug-build-${{ github.run_number }}
          release_name: Debug Build #${{ github.run_number }}
          body: |
            Automatic debug build from commit ${{ github.sha }}
            
            Download the APK from the artifacts section.
          draft: false
          prerelease: true
