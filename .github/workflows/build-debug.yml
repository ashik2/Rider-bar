name: Build Debug APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Fix corrupted gradle-wrapper.jar
        run: |
          echo "Checking gradle-wrapper.jar integrity..."
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar is missing or empty. Downloading from official Gradle release..."
            mkdir -p gradle/wrapper
            curl -L -o gradle/wrapper/gradle-wrapper.jar https://services.gradle.org/distributions/gradle-9.3.1-wrapper.jar
            echo "Downloaded gradle-wrapper.jar successfully"
          else
            echo "gradle-wrapper.jar exists. Checking if it's valid..."
            if ! java -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain --version &>/dev/null; then
              echo "gradle-wrapper.jar is invalid. Replacing with official download..."
              rm -f gradle/wrapper/gradle-wrapper.jar
              curl -L -o gradle/wrapper/gradle-wrapper.jar https://services.gradle.org/distributions/gradle-9.3.1-wrapper.jar
            fi
          fi

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: debug-build-${{ github.run_number }}
          release_name: Debug Build #${{ github.run_number }}
          body: |
            Automatic debug build from commit ${{ github.sha }}
            
            Download the APK from the artifacts section.
          draft: false
          prerelease: true
